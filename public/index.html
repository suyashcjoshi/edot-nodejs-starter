<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello EDOT · Node.js</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Space+Grotesk:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d0d1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: none;
      font-family: 'Inter', Arial, sans-serif;
    }

    #cursor {
      position: fixed;
      width: 18px;
      height: 18px;
      border: 2px solid #00d2ff;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 9999;
      box-shadow: 0 0 8px #00d2ff, 0 0 20px rgba(0,210,255,0.4);
      transition: left 0.04s, top 0.04s;
    }

    #cursor-dot {
      position: fixed;
      width: 5px;
      height: 5px;
      background: #f04e98;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 9998;
      box-shadow: 0 0 6px #f04e98;
      transition: left 0.12s ease, top 0.12s ease;
    }

    .stage {
      text-align: center;
      user-select: none;
    }

    .ascii-block {
      display: block;
      white-space: pre;
      font-family: 'Space Mono', monospace;
      line-height: 1.14;
    }

    .ch {
      display: inline-block;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.25s ease;
      will-change: transform;
    }

    /* color themes per section */
    .hello-section  .ch { color: #7ccfff; font-size: 0.85rem; }
    .edot-section   .ch { color: #00d2ff; font-size: 1.4rem;  }

    .nodejs-label {
      font-family: 'Space Grotesk', 'Inter', Arial, sans-serif;
      font-size: 3.6rem;
      font-weight: 700;
      color: #68d391;
      letter-spacing: 0.12em;
      text-shadow: 0 0 24px rgba(104, 211, 145, 0.45);
      line-height: 1.14;
    }
    .nodejs-label .dot {
      color: #f04e98;
      text-shadow: 0 0 18px #f04e98;
    }

    .gap { height: 18px; }
    .gap-sm { height: 10px; }

    #header {
      position: fixed;
      top: 22px;
      font-family: 'Inter', Arial, sans-serif;
      font-size: 0.75rem;
      line-height: 1.55;
      color: #7ccfff;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-align: center;
    }
    #header em {
      color: #f04e98;
      font-style: normal;
    }

    #footer {
      position: fixed;
      bottom: 24px;
      font-family: 'Inter', Arial, sans-serif;
      font-size: 0.85rem;
      line-height: 1.55;
      color: #7ccfff;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    #footer a {
      color: #f04e98;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.2s, text-shadow 0.2s;
    }
    #footer a:hover {
      color: #00d2ff;
      text-shadow: 0 0 10px #00d2ff;
    }
  </style>
</head>
<body>
  <div id="header">Observe this app with <em>Elastic Observability</em></div>
  <div id="cursor"></div>
  <div id="cursor-dot"></div>
  <div class="stage" id="stage"></div>
  <div id="footer">Learn more about <a href="https://www.elastic.co/docs/reference/opentelemetry/edot-sdks" target="_blank" rel="noopener">Elastic's OpenTelemetry EDOT SDKs</a></div>

  <script>
    const ART = {
      hello: [
        " _   _      _ _       ",
        "| | | | ___| | | ___  ",
        "| |_| |/ _ \\ | |/ _ \\ ",
        "|  _  |  __/ | | (_) |",
        "|_| |_|\\___|_|_|\\___/ "
      ],
      edot: [
        "███████╗██████╗  ██████╗ ████████╗",
        "██╔════╝██╔══██╗██╔═══██╗╚══██╔══╝",
        "█████╗  ██║  ██║██║   ██║   ██║   ",
        "██╔══╝  ██║  ██║██║   ██║   ██║   ",
        "███████╗██████╔╝╚██████╔╝   ██║   ",
        "╚══════╝╚═════╝  ╚═════╝    ╚═╝   "
      ],
    };

    const stage = document.getElementById('stage');
    const allChars = [];

    function buildSection(lines, className) {
      const wrap = document.createElement('div');
      wrap.className = className;
      lines.forEach(line => {
        const row = document.createElement('div');
        row.className = 'ascii-block';
        [...line].forEach(c => {
          const sp = document.createElement('span');
          sp.className = 'ch';
          sp.textContent = c;
          sp._baseColor = null; // resolved at runtime
          row.appendChild(sp);
          allChars.push(sp);
        });
        wrap.appendChild(row);
      });
      stage.appendChild(wrap);
    }

    function gap(size) {
      const d = document.createElement('div');
      d.className = size === 'sm' ? 'gap-sm' : 'gap';
      stage.appendChild(d);
    }

    buildSection(ART.hello,  'hello-section');
    gap('sm');
    buildSection(ART.edot,   'edot-section');
    gap();

    const nodeLabel = document.createElement('div');
    nodeLabel.className = 'nodejs-label';
    nodeLabel.innerHTML = 'Node<span class="dot">.</span>js';
    stage.appendChild(nodeLabel);

    // ── cursor ──────────────────────────────────────────────
    const cursor = document.getElementById('cursor');
    const dot    = document.getElementById('cursor-dot');
    let mx = -999, my = -999;

    document.addEventListener('mousemove', e => {
      mx = e.clientX; my = e.clientY;
      cursor.style.left = mx + 'px';
      cursor.style.top  = my + 'px';
      dot.style.left    = mx + 'px';
      dot.style.top     = my + 'px';
    });

    // ── character repulsion ──────────────────────────────────
    const RADIUS = 90;
    const PUSH   = 45;

    function tick() {
      allChars.forEach(sp => {
        const r = sp.getBoundingClientRect();
        const cx = r.left + r.width  / 2;
        const cy = r.top  + r.height / 2;
        const dx = cx - mx;
        const dy = cy - my;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < RADIUS && dist > 0) {
          const f = (RADIUS - dist) / RADIUS;
          const ang = Math.atan2(dy, dx);
          const px = Math.cos(ang) * f * PUSH;
          const py = Math.sin(ang) * f * PUSH;
          sp.style.transform = `translate(${px}px, ${py}px)`;
          // shift hue from base toward pink
          const hue = 190 + f * 150;
          const lit = 55  + f * 30;
          sp.style.color = `hsl(${hue}, 100%, ${lit}%)`;
        } else {
          sp.style.transform = '';
          sp.style.color = '';
        }
      });
      requestAnimationFrame(tick);
    }

    tick();
  </script>
</body>
</html>
