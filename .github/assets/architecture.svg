<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 190" width="700" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4A4F5A"/>
    </marker>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="700" height="190" rx="10" fill="#1a1b20"/>

  <!-- Tagline -->
  <text x="350" y="30" text-anchor="middle" fill="#69707D" font-size="10.5" letter-spacing="2">ZERO CODE CHANGES  ·  OPENTELEMETRY NATIVE</text>

  <!-- Box 1: Express App -->
  <rect x="20" y="48" width="175" height="88" rx="7" fill="#1E1F26" stroke="#36A2EF" stroke-width="1.5"/>
  <text x="107" y="84" text-anchor="middle" fill="#DFE5EF" font-size="13" font-weight="600">Express App</text>
  <text x="107" y="103" text-anchor="middle" fill="#98A2B3" font-size="11" font-family="'Courier New', monospace">app.js</text>
  <text x="107" y="121" text-anchor="middle" fill="#36A2EF" font-size="9.5" letter-spacing="1">UNTOUCHED</text>

  <!-- Box 2: EDOT SDK -->
  <rect x="262" y="48" width="175" height="88" rx="7" fill="#1E1F26" stroke="#00BFB3" stroke-width="1.5"/>
  <text x="350" y="82" text-anchor="middle" fill="#DFE5EF" font-size="13" font-weight="600">EDOT Node.js SDK</text>
  <text x="350" y="100" text-anchor="middle" fill="#98A2B3" font-size="9.5" font-family="'Courier New', monospace">@elastic/opentelemetry-node</text>
  <text x="350" y="121" text-anchor="middle" fill="#00BFB3" font-size="9.5" letter-spacing="1">--import FLAG</text>

  <!-- Box 3: Elastic Observability -->
  <rect x="504" y="48" width="175" height="88" rx="7" fill="#1E1F26" stroke="#00BFB3" stroke-width="1.5"/>
  <text x="592" y="80" text-anchor="middle" fill="#DFE5EF" font-size="13" font-weight="600">Elastic</text>
  <text x="592" y="98" text-anchor="middle" fill="#DFE5EF" font-size="13" font-weight="600">Observability</text>
  <text x="592" y="118" text-anchor="middle" fill="#98A2B3" font-size="9.5">Traces · Metrics · Logs</text>

  <!-- Arrow 1: App → EDOT -->
  <line x1="197" y1="92" x2="259" y2="92" stroke="#343741" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="228" y="85" text-anchor="middle" fill="#69707D" font-size="9">auto-instruments</text>

  <!-- Arrow 2: EDOT → Elastic -->
  <line x1="439" y1="92" x2="501" y2="92" stroke="#343741" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="470" y="85" text-anchor="middle" fill="#69707D" font-size="9">OTLP / HTTPS</text>

  <!-- Animated data dot: arrow 1 -->
  <circle r="4" fill="#F04E98" filter="url(#glow)">
    <animateMotion dur="1.6s" repeatCount="indefinite" path="M197,92 L259,92"/>
  </circle>

  <!-- Animated data dot: arrow 2 (staggered) -->
  <circle r="4" fill="#F04E98" filter="url(#glow)">
    <animateMotion dur="1.6s" repeatCount="indefinite" begin="0.8s" path="M439,92 L501,92"/>
  </circle>

  <!-- Footer -->
  <text x="350" y="170" text-anchor="middle" fill="#3A3F48" font-size="10">Your machine  →  Elastic Cloud (Serverless or hosted Kibana)</text>
</svg>
